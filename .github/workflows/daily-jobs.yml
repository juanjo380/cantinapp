# Trabajo diario de CantinAPP: alertas de stock, co-ocurrencias y correo-resumen.
# Render (plan gratis) no tiene cron y se duerme: esta llamada además lo despierta.
# Secrets del repositorio (Settings -> Secrets and variables -> Actions):
#   CANTINAPP_API_URL  p. ej. https://cantinapp.onrender.com (sin barra final)
#   CRON_SECRET        el mismo valor que la variable CRON_SECRET de Render
name: Trabajo diario

on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC = 6:00 en Colombia
  workflow_dispatch: {}

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Llamar al endpoint interno
        env:
          API_URL: ${{ secrets.CANTINAPP_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # El primer intento puede tardar 30-60 s mientras Render despierta; reintentar es seguro:
          # el correo-resumen se envía como máximo una vez al día por negocio.
          response=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 30 --retry-all-errors --max-time 600 \
            -X POST -H "X-Cron-Secret: ${CRON_SECRET}" \
            "${API_URL}/api/internal/jobs/daily")
          echo "$response" | jq .
          failed=$(echo "$response" | jq '.failed')
          if [ "$failed" != "0" ]; then
            echo "::error::${failed} negocio(s) fallaron; revisa el log de Render"
            exit 1
          fi
